[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sportsplits"
version = "0.1.0"
description = "Triathlon results analyser — Dash app + RaceResult scraping pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dash",
    "pandas",
    "numpy",
    "matplotlib",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest"]

# Optional convenience entry point (available after `pip install -e .`).
# Running without installing also works: `python run.py`.
[project.scripts]
sportsplits = "sportsplits.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
